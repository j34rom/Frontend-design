<!DOCTYPE html>
<html>
  <head>
    <title>Student Form</title>
    <link rel="stylesheet" href="Practice.css">
  </head>
  <body>
    <h1>STUDENT FORM</h1>
    <h2>Enrollment Form</h2>
    <p>Kindly fill out the form to proceed the enrollment</p>
    <form id="enrollmentForm">
      <!-- Name (Already working) -->
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" placeholder="e.g., Juan Dela Cruz" required>
      </div>
      <div class="form-group">
       <label for="age">Age:</label>
       <input type="number" placeholder="e.g., 18" required>
      </div>
      <div class="form-group">
        <label for="gender">Gender:</label>
        <select id="gender" required>
          <option value="">Gender</option>
          <option value="men">Men</option>
          <option value="women">Women</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label for="address">Address:</label>
        <input type="text" placeholder="full address" required>
      </div>

      <div class="form-group">
        <label for="civil-status">Civil Status:</label>
        <select id="civil-status" required>
          <option value="">Civil Status</option>
          <option value="single">Single</option>
          <option value="married">Married</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">Submit Form</button>
    </form>
    <div id="confirmationMessage"></div>
    <h4>Enrollment Form sy.2026-2027</h4>
    <script src="Practice.js"></script>
  </body>
</html>
